# ════════════════════════════════════════════════════════════════════════════════
# scale.properties — Weighbridge Scale Server configuration
# Place this file next to scale-server-1.0.0-jar-with-dependencies.jar
# Restart the server for changes to take effect.
# ════════════════════════════════════════════════════════════════════════════════
# ── Serial port ───────────────────────────────────────────────────────────────
# AUTO (default) — scans all available ports at startup and uses the first one
#                  that responds with recognised scale data.  No config needed
#                  when deploying to a new branch; the correct port is found
#                  automatically.
#
# To skip scanning and connect directly (faster startup):
#   Windows: port=COM3
#   Linux:   port=/dev/ttyUSB0
port=AUTO
# Baud rate — must match the DIP-switch setting on the physical scale indicator
baud=9600
# ── Protocol type ─────────────────────────────────────────────────────────────
# 1 = CAS NT-500 v1  — polls with byte 0x01
#                      Packet: "ST/US/OL GS/NT,x,<8-char weight>kg"  (20 chars)
# 2 = CAS NT-500 v2  — polls with ASCII "01RW\r"
#                      Same 20-char CAS packet format as type 1
# 5 = Type 5 burst   — no poll needed; device pushes STX-framed data
#                      Packet: STX...weight[5:11]...!...CR  (21 bytes)
indicator.type=1
# ── Weight multiplier ─────────────────────────────────────────────────────────
# Applied after parsing:  final_kg = parsed_value * scale.to.kq
# 1.0  = device already reports kg  (default)
# 0.001 = device reports grams
scale.to.kq=1.0
# ── HTTP/SSE server ───────────────────────────────────────────────────────────
# Port the embedded server listens on.
# Frontend connects to:  http://<machine-ip>:<http.port>/stream
http.port=8435
# ── Device label ──────────────────────────────────────────────────────────────
# Human-readable name included in every SSE event's "device" field.
# Leave blank to auto-generate from indicator.type.
device.name=
# ── Debug logging ─────────────────────────────────────────────────────────────
# false (default) — only INFO and above written to scale_server_0.log
# true            — also writes FINE-level byte/packet traces to scale_debug.log
#                   The debug file is overwritten on every run (temporary capture).
#                   Enable only when diagnosing serial protocol issues.
debug=false
